<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--glass-blur:blur(28px) saturate(180%);--deep:#03080f}
html{scroll-behavior:smooth}
body{background:var(--deep);color:rgba(255,255,255,0.94);font-family:'Inter',sans-serif;font-weight:300;overflow-x:hidden;min-height:100vh}

/* NAV */
nav{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);z-index:100;display:flex;align-items:center;background:rgba(255,255,255,0.10);border:none;backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-radius:100px;padding:0.4rem 0.6rem;box-shadow:0 8px 32px rgba(0,0,0,0.4),inset 0 1.5px 0 rgba(255,255,255,0.22),inset 0 -1px 0 rgba(0,0,0,0.18);white-space:nowrap}
nav a{font-size:0.72rem;font-weight:400;letter-spacing:0.13em;text-transform:uppercase;color:rgba(255,255,255,0.72);text-decoration:none;padding:0.4rem 1rem;position:relative;transition:color .25s ease}
nav a::after{content:'';position:absolute;bottom:2px;left:1rem;right:1rem;height:1px;background:rgba(255,255,255,0.85);transform:scaleX(0);transform-origin:center;transition:transform .3s cubic-bezier(.25,.46,.45,.94)}
nav a:hover{color:#fff}
nav a:hover::after{transform:scaleX(1)}
.nav-dot{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,0.22);margin:0 .15rem;flex-shrink:0}

/* PAGE */
.page-wrap{position:relative;z-index:1;padding:6rem 3rem 6rem;max-width:1400px;margin:0 auto}

/* HEADER — all centred */
.gallery-header{
  text-align:center;
  margin-bottom:2.5rem;
}
.back-link{
  display:inline-flex;align-items:center;gap:0.5rem;
  font-size:0.65rem;letter-spacing:0.22em;text-transform:uppercase;
  color:rgba(255,255,255,0.35);text-decoration:none;
  margin-bottom:1.25rem;transition:color .2s ease;
}
.back-link:hover{color:rgba(255,255,255,0.7)}
.gallery-title{
  font-family:'Archivo Black',sans-serif;
  font-size:clamp(2.5rem,6vw,5rem);font-weight:900;letter-spacing:-0.01em;line-height:1;
  background:linear-gradient(160deg,rgba(255,255,255,0.92) 0%,rgba(200,218,255,0.72) 50%,rgba(255,255,255,0.78) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 -1px 0 rgba(255,255,255,0.3)) drop-shadow(0 4px 20px rgba(80,120,255,0.18));
  margin-bottom:0.5rem;
}
.gallery-sub{
  font-family:'Raleway',sans-serif;font-size:0.8rem;font-weight:300;
  color:rgba(255,255,255,0.38);letter-spacing:0.06em;
  margin-bottom:1.75rem;
  min-height:1.2em;
}

/* GENRE TABS — centred */
.genre-tabs{
  display:flex;align-items:center;justify-content:center;
  gap:0.5rem;flex-wrap:wrap;
}
.genre-btn{
  background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.16);
  backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
  color:rgba(255,255,255,0.55);font-family:'Inter',sans-serif;font-size:.68rem;font-weight:400;
  letter-spacing:.16em;text-transform:uppercase;padding:.45rem 1.1rem;border-radius:100px;cursor:pointer;
  transition:all .25s ease;box-shadow:inset 0 1px 0 rgba(255,255,255,0.08);
}
.genre-btn:hover{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.3);color:rgba(255,255,255,0.85)}
.genre-btn.active{background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.48);color:#fff;box-shadow:inset 0 1.5px 0 rgba(255,255,255,0.25),0 0 20px rgba(140,175,255,0.12)}

/* DIVIDER */
.header-divider{
  width:40px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);
  margin:1.75rem auto 2rem;
}

/* MASONRY GRID */
.gallery-grid{columns:4;column-gap:1rem}
.gallery-item{
  break-inside:avoid;margin-bottom:1rem;border-radius:10px;overflow:hidden;
  position:relative;cursor:pointer;border:1px solid rgba(255,255,255,0.07);
  transition:transform .35s cubic-bezier(.25,.46,.45,.94),box-shadow .35s ease,filter .35s ease;
  filter:brightness(0.88);
}
.gallery-item:hover{transform:scale(1.025) translateY(-3px);box-shadow:0 14px 40px rgba(0,0,0,0.65),0 0 0 1px rgba(140,175,255,0.22);filter:brightness(1.05);z-index:2}
.gallery-item img{display:block;width:100%;height:auto;transition:transform .5s ease;pointer-events:none}
.gallery-item:hover img{transform:scale(1.03)}
.gallery-item-ph{width:100%;display:block}
.gallery-item-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(3,8,20,0.75) 0%,transparent 50%);opacity:0;transition:opacity .3s ease;display:flex;align-items:flex-end;padding:0.9rem 1rem}
.gallery-item:hover .gallery-item-overlay{opacity:1}
.gallery-item-caption{font-size:0.65rem;letter-spacing:0.1em;color:rgba(255,255,255,.88);font-weight:300;text-transform:uppercase}

/* Placeholder colors */
.ph-a1{background:linear-gradient(160deg,#060d20,#1a2a50,#0d1a38)}
.ph-a2{background:linear-gradient(145deg,#080e22,#142048,#0a1828)}
.ph-a3{background:linear-gradient(130deg,#040810,#0c1838,#060f22)}

.ph-au2{background:linear-gradient(140deg,#040e12,#083024,#0a2238)}
.ph-au3{background:linear-gradient(160deg,#050c16,#0c2828,#082035)}

.ph-l2{background:linear-gradient(155deg,#101a08,#243a10,#18280a)}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s ease}
.lightbox.active{opacity:1;pointer-events:all}
.lightbox-backdrop{position:absolute;inset:0;background:rgba(3,8,15,0.45);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);cursor:pointer}
.lightbox-img-wrap{position:relative;z-index:2;max-width:88vw;max-height:88vh;display:flex;align-items:center;justify-content:center;transform:scale(0.88);transition:transform 0.38s cubic-bezier(.25,.46,.45,.94)}
.lightbox.active .lightbox-img-wrap{transform:scale(1)}
.lightbox-img{max-width:88vw;max-height:86vh;object-fit:contain;border-radius:10px;box-shadow:0 40px 100px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.08);display:block;transition:opacity 0.18s ease}
.lb-btn{position:fixed;z-index:3;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,0.09);border:1px solid rgba(255,255,255,0.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:rgba(255,255,255,0.82);font-size:1.1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .22s ease;box-shadow:inset 0 1.5px 0 rgba(255,255,255,0.18),0 4px 20px rgba(0,0,0,.4)}

.lb-close{top:1.5rem;right:1.5rem}
.lb-prev{left:1.5rem;top:50%;transform:translateY(-50%)}
.lb-next{right:1.5rem;top:50%;transform:translateY(-50%)}

/* FOOTER */
footer{position:relative;z-index:1}
.footer-main{padding:4rem 4rem 2.5rem;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:3rem}
.footer-left .footer-location{font-size:.65rem;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-bottom:0.7rem}
.footer-left .footer-email{font-family:'Archivo Black',sans-serif;font-size:1.4rem;font-weight:900;color:rgba(190,210,255,0.85);text-decoration:none;transition:color .22s;display:block;letter-spacing:-0.01em}
.footer-left .footer-email:hover{color:#fff}
.footer-center-label{font-size:.6rem;letter-spacing:.35em;text-transform:uppercase;color:rgba(255,255,255,0.25);margin-bottom:1rem;text-align:center}
.footer-index{list-style:none;display:flex;flex-direction:column;gap:.5rem;align-items:center}
.footer-index a{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,0.42);text-decoration:none;transition:color .2s;position:relative}
.footer-index a::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:rgba(255,255,255,0.5);transform:scaleX(0);transform-origin:center;transition:transform .28s ease}
.footer-index a:hover{color:rgba(255,255,255,0.78)}
.footer-index a:hover::after{transform:scaleX(1)}
.footer-right{display:flex;flex-direction:column;align-items:flex-end;gap:1rem}
.footer-social-label{font-size:.6rem;letter-spacing:.35em;text-transform:uppercase;color:rgba(255,255,255,0.25)}
.social-btns{display:flex;gap:.65rem}
.social-btn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.20);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:rgba(255,255,255,0.65);text-decoration:none;transition:all .25s ease;box-shadow:inset 0 1px 0 rgba(255,255,255,0.15),0 4px 16px rgba(0,0,0,0.3)}
.social-btn:hover{background:rgba(255,255,255,0.16);border-color:rgba(255,255,255,0.42);color:#fff;transform:translateY(-2px)}
.social-btn svg{width:18px;height:18px;fill:currentColor}
.footer-divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);margin:0 4rem}
.footer-copy{padding:1.25rem 4rem 2rem;text-align:center;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,0.2)}

const phMap = {
  astro:     ['ph-a1','ph-a2','ph-a3','ph-a4','ph-a5'],
  aurora:    ['ph-au1','ph-au2','ph-au3','ph-au1','ph-au2'],
  landscape: ['ph-l1','ph-l2','ph-l3','ph-l1','ph-l2'],
  glowworms: ['ph-g1','ph-g2','ph-g3','ph-g1','ph-g2'],
};

let currentGallery = 'astro';
let lbIndex = 0;
let lbImages = [];

function getParam(k){ return new URLSearchParams(window.location.search).get(k); }

function renderGallery(key) {
  currentGallery = key;
  const data = galleries[key];
  if (!data) return;

  document.title = data.title + ' — Josh McGuigan Photography';
  document.getElementById('galleryTitle').textContent = data.title;
  const subEl = document.getElementById('gallerySub');
  subEl.textContent = data.sub;
  subEl.style.display = data.sub ? 'block' : 'none';

  document.querySelectorAll('.genre-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.g === key);
  });

  history.replaceState(null, '', '?g=' + key);

  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = '';
  lbImages = data.images;
  const phs = phMap[key] || ['ph-a1'];

  data.images.forEach((img, i) => {
    const item = document.createElement('div');
    item.className = 'gallery-item';
    const [rw, rh] = img.ratio.split('/').map(Number);
    const paddingPct = (rh / rw * 100).toFixed(2);
    const ph = phs[i % phs.length];
    item.innerHTML = `
      <div class="gallery-item-ph ${ph}" style="padding-bottom:${paddingPct}%;position:relative;">
        <img
          src="images/gallery/${img.file}.jpg"
          alt="${img.caption}"
          loading="lazy"
          style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;"
          onerror="this.style.opacity='0'"
        >
      </div>
      <div class="gallery-item-overlay">
        <span class="gallery-item-caption">${img.caption}</span>
      </div>
    `;
    item.addEventListener('click', () => openLightbox(i));
    grid.appendChild(item);
  });
}

// LIGHTBOX
const lightbox = document.getElementById('lightbox');
const lbImg    = document.getElementById('lbImg');

function openLightbox(index) {
  lbIndex = index;
  const img = lbImages[lbIndex];
  lbImg.src = `images/gallery/${img.file}.jpg`;
  lbImg.alt = img.caption;
  lightbox.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightbox.classList.remove('active');
  document.body.style.overflow = '';
  setTimeout(() => { lbImg.src = ''; }, 320);
}

function lbStep(dir) {
  lbIndex = (lbIndex + dir + lbImages.length) % lbImages.length;
  lbImg.style.opacity = '0';
  setTimeout(() => {
    const img = lbImages[lbIndex];
    lbImg.src = `images/gallery/${img.file}.jpg`;
    lbImg.alt = img.caption;
    lbImg.style.opacity = '1';
  }, 150);
}

document.getElementById('lbClose').addEventListener('click', e => { e.stopPropagation(); closeLightbox(); });
document.getElementById('lbBackdrop').addEventListener('click', e => { e.stopPropagation(); closeLightbox(); });
document.getElementById('lbPrev').addEventListener('click', e => { e.stopPropagation(); lbStep(-1); });
document.getElementById('lbNext').addEventListener('click', e => { e.stopPropagation(); lbStep(1); });
document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') lbStep(-1);
  if (e.key === 'ArrowRight') lbStep(1);
});
let touchStartX = 0;
lightbox.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive:true });
lightbox.addEventListener('touchend', e => {
  const dx = touchStartX - e.changedTouches[0].clientX;
  if (Math.abs(dx) > 40) lbStep(dx > 0 ? 1 : -1);
});

document.querySelectorAll('.genre-btn').forEach(btn => {
  btn.addEventListener('click', () => renderGallery(btn.dataset.g));
});

renderGallery(getParam('g') || 'astro');
</script>
